name: Atualizar estatísticas do perfil

# As imagens de estatísticas ficam em cache no camo (proxy de imagens do
# GitHub). Este workflow pede o purge desse cache periodicamente, para que
# os cards sejam rebuscados e apareçam sempre atualizados no perfil.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  purgar-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Purgar cache das imagens (camo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A URL do camo é /<digest>/<url-original-em-hex>; o caminho inteiro
          # faz parte da chave de cache, então precisa ser capturado completo.
          curl -sS \
            -H "Accept: application/vnd.github.html" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/readme" \
            | grep -oE 'https://camo\.githubusercontent\.com/[^"<>[:space:]]+' \
            | sed 's/&amp;/\&/g' \
            | sort -u > urls.txt

          total=$(wc -l < urls.txt)
          echo "Imagens encontradas: $total"
          if [ "$total" -eq 0 ]; then
            echo "Nenhuma imagem encontrada no README — algo mudou na extração."
            exit 1
          fi

          while read -r url; do
            printf '%s -> ' "${url##*/camo.githubusercontent.com/}"
            curl -sS -X PURGE "$url" || echo "falhou"
            echo
          done < urls.txt
